services:
  mysql:
    image: mysql:8.0
    container_name: medicagent-db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: medicagent_rootpassword
      MYSQL_DATABASE: medicagent-db
      MYSQL_USER: medicagent
      MYSQL_PASSWORD: medicagent_password
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./MedicAgent-main/data/mysql-init:/docker-entrypoint-initdb.d:ro
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: medicagent-qdrant
    ports:
      - "6337:6333"
      - "6338:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

volumes:
  mysql-data:
  qdrant-data:
