    #   responses:
    #     '200':
    #       description: OK
    #       content: { application/json: { schema: { $ref: '#/components/schemas/ConversationSnapshot' } } }
    # patch:
    #   summary: Update conversation (close, locale, metadata)
    #   parameters:
    #     - in: path
    #       name: conversation_id
    #       required: true
    #       schema: { type: string }
    #   requestBody:
    #     content:
    #       application/json:
    #         schema: { $ref: '#/components/schemas/ConversationPatch' }
    #   responses:
    #     '200':
    #       description: Updated
    #       content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } }

  /v1/chat/{conversation_id}/stream:
    get:
      summary: SSE stream for conversation
      description: Stream token-by-token và sự kiện (message.delta, message.completed, state.updated…).
      parameters:
        - in: path
          name: conversation_id
          required: true
          schema: { type: string }
        - in: query
          name: cursor
          description: Message ID bắt đầu theo dõi từ đó (tùy chọn).
          schema: { type: string }
      responses:
        '200':
          description: text/event-stream
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  event: message.delta
                  data: {"message_id":"msg_1","delta":"Xin "}
                  
                  event: message.completed
                  data: {"message_id":"msg_1","content":"Xin chào"}

components:
  schemas:
    # UpsertConversation:
    #   type: object
    #   properties:
    #     user_ref: { type: string, description: "user/device id" }
    #     channel: { type: string, example: "kiosk" }
