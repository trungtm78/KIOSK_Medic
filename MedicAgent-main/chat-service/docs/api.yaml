openapi: 3.1.0
info:
  title: Chat Orchestrator API
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /v1/chat/{conversation_id}:
    # put:
    #   summary: Upsert conversation (client-provided ID)
    #   description: Tạo mới hoặc tái sử dụng conversation theo conversation_id do client gửi.
    #   parameters:
    #     - in: path
    #       name: conversation_id
    #       required: true
    #       schema: { type: string }
    #     - in: header
    #       name: X-Tenant-Id
    #       required: true
    #       schema: { type: string }
    #     - in: header
    #       name: Idempotency-Key
    #       required: true
    #       schema: { type: string, format: uuid }
    #   requestBody:
    #     content:
    #       application/json:
    #         schema:
    #           $ref: '#/components/schemas/UpsertConversation'
    #   responses:
    #     '201':
    #       description: Created
    #       content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } }
    #     '200':
    #       description: Reused existing conversation
    #       content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } }
    post:
      summary: Send a message (and upsert if needed)
      description: Gửi message người dùng; nếu conversation chưa tồn tại thì server tự tạo.
      parameters:
        - in: path
          name: conversation_id
          required: true
          schema: { type: string }
        - in: header
          name: X-Tenant-Id
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessage' }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendAck' }
    # get:
    #   summary: Get conversation snapshot
    #   description: Lấy trạng thái nhanh: FSM state, slots, last messages (phục vụ resume UI).
    #   parameters:
    #     - in: path
