  #     - medicagent-chat-service


  medicagent-core-service:
    build:
      context: ./core-service
      dockerfile: dockerfile
    image: medicagent-core-service:latest
    container_name: medicagent-core-service
    ports:
      - "8083:8080"
      # - "6333:6333"
    environment:
      - DB_USER=${DB_USER:-medicagent}
      - DB_PASSWORD=${DB_PASSWORD:-medicagent_password}
      - DB_HOST=medicagent-db
      - DB_PORT=3306
      - DIRECTORY_DB_NAME=${DIRECTORY_DB_NAME:-medicagent-directory-db}
      - QUEUE_DB_NAME=${QUEUE_DB_NAME:-medicagent-queue-db}
      - QDRANT_ENABLED=${QDRANT_ENABLED:-true}
      - QDRANT_HOST=127.0.0.1
      - QDRANT_PORT=6333
      - INFO_LOOKUP_LEXICAL_WEIGHT=${INFO_LOOKUP_LEXICAL_WEIGHT:-0.1}
      - INFO_LOOKUP_SEMANTIC_WEIGHT=${INFO_LOOKUP_SEMANTIC_WEIGHT:-0.7}
    volumes:
      - ./core-service/data/indexes:/app/data/indexes
    restart: unless-stopped
    depends_on:
      - medicagent-db
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  medicagent-admin-service:
    build:
      context: ./admin-service
      dockerfile: dockerfile
    image: admin-service:latest
    container_name: admin-service
    ports:
      - "8090:8090"
    environment:
      - ENV=production
      - ADMIN_DB_URL=mysql+pymysql://${MYSQL_USER:-medicagent}:${MYSQL_PASSWORD:-medicagent_password}@medicagent-db:3306/${ADMIN_DB_NAME:-medicagent-admin-db}
    # volumes:
    #   - ./admin-service/app:/app/app
    restart: unless-stopped
    depends_on:
      - medicagent-db

  medicagent-chat-service:
    build:
      context: ./chat-service
      dockerfile: dockerfile
    image: medicagent-chat-service:latest
    container_name: medicagent-chat-service
    env_file:
      - .env
    ports:
      - "8082:8000"
    environment:
      - ENV=production
      - MYSQL_USER=${MYSQL_USER:-medicagent}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-medicagent_password}
      - CHAT_DB_URL=mysql+pymysql://${MYSQL_USER:-medicagent}:${MYSQL_PASSWORD:-medicagent_password}@medicagent-db:3306/${MYSQL_DATABASE:-medicagent-db}
      - INTENT_MODEL_DIR=/app/models/intent_classifier
      - LLM_API_BASE=http://medicagent-llm:8000/v1
      - LLM_MODEL=Jan-nano-128k
    volumes:
      - ./chat-service/models/intent_classifier:/app/models/intent_classifier:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  medicagent-sttphowhisper-service:
    build:
      context: ./sttphowhisper-service
      dockerfile: Dockerfile
    image: medicagent-sttphowhisper-service:latest
    container_name: medicagent-sttphowhisper-service
    ports:
      - "7081:8000"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]
    environment:
      - WHISPER_MODEL=mad1999/pho-whisper-medium-ct2
      - WHISPER_DEVICE=cuda
      - WHISPER_COMPUTE_TYPE=float16
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  medicagent-stt-zipformer-service:
    build:
      context: ./stt-zipformer
      dockerfile: Dockerfile
    image: medicagent-stt-zipformer-service:latest
    container_name: medicagent-stt-zipformer-service
    runtime: nvidia
    ports:
      - "7082:8000"
    environment:
      - ZIPFORMER_PROVIDER=${ZIPFORMER_PROVIDER:-cuda}
      - ZIPFORMER_NUM_THREADS=${ZIPFORMER_NUM_THREADS:-2}
      - ZIPFORMER_DECODING_METHOD=${ZIPFORMER_DECODING_METHOD:-greedy_search}
      - HF_HOME=/app/cache/huggingface
      - NVIDIA_VISIBLE_DEVICES=${ZIPFORMER_VISIBLE_DEVICES:-all}
      - CUDA_VISIBLE_DEVICES=${ZIPFORMER_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ./model_cache/zipformer:/app/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  medicagent-db:
    image: mysql:8.0
    container_name: medicagent-db
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-medicagent_rootpassword}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-medicagent-db}
      - MYSQL_USER=${MYSQL_USER:-medicagent}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-medicagent_password}
      - MYSQL_ROOT_HOST=%
    volumes:
      - /home/thuantruong/01_MedicAgent/var/mysql2:/var/lib/mysql
      - ./data/mysql-init:/docker-entrypoint-initdb.d:ro
      # - /home/thuantruong/01_MedicAgent/src/MedicAgent/data/dump:/opt/db-dump
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  ollama:
