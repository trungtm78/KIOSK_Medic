  medicagent-ollama:
    image: ollama/ollama:0.12.11
    container_name: medicagent-ollama
    ports:
      - "8084:11434"        # API Ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=24h  # giữ model nóng mặc định 24h
    volumes:
      - ollama:/root/.ollama   # cache/tải model
    # Bật GPU nếu có NVIDIA Container Toolkit
    gpus: all
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:11434/api/tags >/dev/null || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    restart: unless-stopped

  medicagent-gateway:
    image: kong:3.6
    container_name: medicagent-gateway
    restart: unless-stopped
    profiles: ["gateway"]
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: "/kong/declarative/kong.yaml"
      KONG_LOG_LEVEL: "info"
      KONG_PROXY_LISTEN: "0.0.0.0:7443 ssl, 0.0.0.0:7080"
      # Bind Admin API to container loopback only; do not publish ports to host
      # KONG_ADMIN_LISTEN: "127.0.0.1:8001, 127.0.0.1:8444 ssl, 127.0.0.1:7080"
      KONG_NGINX_WORKER_PROCESSES: "auto"
      KONG_SSL_CERT: "/etc/kong/certs/selfsigned.crt"
      KONG_SSL_CERT_KEY: "/etc/kong/certs/selfsigned.key"
    ports:
      - "7443:7443"
      - "7080:7080"
    volumes:
      - ./gateway/kong:/kong/declarative:ro
      - ./gateway/logs:/usr/local/kong/logs
      - ./gateway/certs:/etc/kong/certs:ro
    depends_on:
      - medicagent-chat-service
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  # bff:
  #   build:
  #     context: ./backend-for-frontend
  #     dockerfile: dockerfile
  #   image: bff:latest
  #   container_name: bff
  #   environment:
  #     - CHAT_SERVICE_BASE_URL=http://medicagent-chat-service:8000
  #     - REQUEST_TIMEOUT_SECONDS=30
  #   ports:
  #     - "8081:8081"
